<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View, fill, edit and digitally sign PDFs in your browser. Files stay on this computer." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PDF Wizard</title>
    <script>
      // Apply the saved theme before first paint (avoids a light flash in dark mode).
      (function () {
        var t = 'light';
        try {
          var p = JSON.parse(localStorage.getItem('pdfwizard.prefs') || '{}').theme;
          if (p === 'dark' || p === 'light') t = p;
          else if (p === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          else t = localStorage.getItem('pdfwizard.themeResolved') || 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f8f8f8;
        color: #6e6e6e;
        font: 14px/1.4 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.2s ease;
      }
      html[data-theme='dark'] #splash {
        background: #1b1b1b;
        color: #a8a8a8;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-logo {
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      #splash.is-error .splash-logo {
        animation: none;
      }
      @keyframes splash-pulse {
        50% {
          transform: scale(0.92);
          opacity: 0.75;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <svg class="splash-logo" width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1f3a5f"/>  <circle cx="52" cy="13" r="5" fill="#ffe9a8" opacity="0.35"/>  <path d="M52 16 L50 58" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>  <circle cx="52" cy="13" r="3" fill="#fff4c8"/>  <path d="M38 3 C35 7 34 10 31 14 L20 29 H44 L38 15 C37 11 39 7 42 6 Z" fill="#8f98a3"/>  <path d="M31 14 L20 29 H44 L38 15" fill="none" stroke="#6f7883" stroke-width="1.2" stroke-linejoin="round"/>  <ellipse cx="32" cy="29.5" rx="20" ry="4" fill="#a9b1ba"/>  <ellipse cx="32" cy="35" rx="8" ry="6" fill="#f0c8a4"/>  <path d="M24.5 33 Q28 30.5 31 32.5 M33 32.5 Q36 30.5 39.5 33" stroke="#f7f7f7" stroke-width="2.2" stroke-linecap="round" fill="none"/>  <circle cx="28.8" cy="35" r="1" fill="#2b2b2b"/>  <circle cx="35.2" cy="35" r="1" fill="#2b2b2b"/>  <path d="M21 35 Q22 50 32 61 Q42 50 43 35 Q39 41 35 40 Q32 42 29 40 Q25 41 21 35 Z" fill="#f4f4f4"/>  <path d="M28 40 Q32 43.5 36 40" stroke="#dcdcdc" stroke-width="1.2" fill="none" stroke-linecap="round"/>  <path d="M32 44 V56 M28 45 Q29 51 31 55 M36 45 Q35 51 33 55" stroke="#dedede" stroke-width="0.9" fill="none" stroke-linecap="round"/></svg>
      <div class="splash-text">Loading PDF Wizard…</div>
    </div>
    <div id="root"></div>
    <noscript>PDF Wizard needs JavaScript to run.</noscript>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>
</html>
